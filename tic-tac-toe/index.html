<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f3ec">
	<title>Tic-Tac-Toe | Games4Me</title>
	<link rel="icon" type="image/svg+xml" href="../favicon.svg">
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="../index.html" aria-label="Games4Me by Hyperforge Studios home"><span class="brand-mark" aria-hidden="true">G4</span><span class="brand-copy"><span class="brand-name">Games<span class="brand-accent">4</span>Me</span><span class="brand-byline">by Hyperforge Studios</span></span></a>
		<a class="back-link" href="../index.html">&#8592; All games</a>
	</header>
	<main class="page-shell">
		<header class="game-heading">
			<p class="eyebrow">STRATEGY / 03</p>
			<h1>Tic-Tac-Toe</h1>
			<p>Three in a row wins. How you get there is the game.</p>
		</header>
		<section class="play-area" aria-label="Tic-Tac-Toe game">
			<div class="mode-row">
				<span class="mode-label">PLAY</span>
				<div class="mode-switch" role="group" aria-label="Choose game mode">
					<button class="mode-button is-active" type="button" data-mode="two" aria-pressed="true">2 players</button>
					<button class="mode-button" type="button" data-mode="computer" aria-pressed="false">Vs computer</button>
				</div>
			</div>
			<p class="game-status" id="status" role="status" aria-live="polite">Player X's turn.</p>
			<div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
				<button class="cell" type="button" data-cell="0" role="gridcell" aria-label="Row 1, column 1, empty"></button>
				<button class="cell" type="button" data-cell="1" role="gridcell" aria-label="Row 1, column 2, empty"></button>
				<button class="cell" type="button" data-cell="2" role="gridcell" aria-label="Row 1, column 3, empty"></button>
				<button class="cell" type="button" data-cell="3" role="gridcell" aria-label="Row 2, column 1, empty"></button>
				<button class="cell" type="button" data-cell="4" role="gridcell" aria-label="Row 2, column 2, empty"></button>
				<button class="cell" type="button" data-cell="5" role="gridcell" aria-label="Row 2, column 3, empty"></button>
				<button class="cell" type="button" data-cell="6" role="gridcell" aria-label="Row 3, column 1, empty"></button>
				<button class="cell" type="button" data-cell="7" role="gridcell" aria-label="Row 3, column 2, empty"></button>
				<button class="cell" type="button" data-cell="8" role="gridcell" aria-label="Row 3, column 3, empty"></button>
			</div>
			<div class="scoreboard" aria-label="Score">
				<div class="score-item score-x"><span>X WINS</span><strong id="x-score">0</strong></div>
				<div class="score-item"><span>DRAWS</span><strong id="draw-score">0</strong></div>
				<div class="score-item score-o"><span>O WINS</span><strong id="o-score">0</strong></div>
			</div>
			<button class="new-round-button" id="new-round" type="button"><span aria-hidden="true">&#8635;</span> New round</button>
		</section>
		<p class="page-footnote">Best of one. Or keep the score going.</p>
	</main>
